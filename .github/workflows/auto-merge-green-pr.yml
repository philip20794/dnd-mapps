name: Auto-merge green pull requests

# This trusted default-branch workflow never checks out or executes PR code.
on:
  workflow_run:
    workflows:
      - Build and deploy Firebase Hosting
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Merge the exact commit that passed CI
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main', per_page: 100
            });
            const pr = prs.find(candidate =>
              candidate.head.sha === run.head_sha &&
              candidate.head.repo.full_name === `${owner}/${repo}` &&
              !candidate.draft
            );
            if (!pr) {
              core.notice('No current non-draft PR matches the successful CI commit.');
              return;
            }
            // GitHub rejects the merge if the branch changed since the verified run.
            const result = await github.rest.pulls.merge({
              owner, repo, pull_number: pr.number,
              merge_method: 'squash', sha: run.head_sha
            });
            if (!result.data.merged) {
              core.setFailed(`PR #${pr.number} could not be merged: ${result.data.message}`);
            } else {
              // Merges made with GITHUB_TOKEN do not trigger on: push workflows.
              // workflow_dispatch is explicitly allowed and publishes the verified merge.
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'firebase-hosting.yml', ref: 'main'
              });
              core.notice(`Merged PR #${pr.number} and dispatched Firebase build/deploy.`);
            }
