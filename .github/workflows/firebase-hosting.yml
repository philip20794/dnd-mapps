name: Build and deploy Firebase Hosting

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install application dependencies
        run: npm ci

      # The worker has no lockfile yet, but is included in the root build's
      # TypeScript checks. Firebase Hosting deploys only the Vite app.
      - name: Install Cloudflare Worker type-check dependencies
        run: npm install --prefix worker --no-package-lock --ignore-scripts

      - name: Run unit tests
        run: npm run test:unit -- --run

      - name: Type-check and build
        run: npm run build
        env:
          VITE_AI_API_BASE_URL: ${{ vars.VITE_AI_API_BASE_URL }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check tabletop UI in browser
        run: npx playwright test e2e/editor-layout.spec.ts --retries=0

      - name: Save Hosting build
        uses: actions/upload-artifact@v4
        with:
          name: firebase-hosting-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Firebase Hosting (live)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-hosting-live
      cancel-in-progress: false
    steps:
      - name: Check out Firebase configuration
        uses: actions/checkout@v4

      - name: Restore the tested build
        uses: actions/download-artifact@v4
        with:
          name: firebase-hosting-dist
          path: dist/

      - name: Check Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DND_MAPPS }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add FIREBASE_SERVICE_ACCOUNT_DND_MAPPS under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy dist/ to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DND_MAPPS }}
          projectId: dnd-mapps
          channelId: live
